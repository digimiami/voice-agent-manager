<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="300" fill="url(#glow1)"/>
  <circle cx="1000" cy="600" r="250" fill="url(#glow2)"/>
  
  <!-- Phone icon center -->
  <g transform="translate(600,350)" filter="url(#glow)">
    <rect x="-40" y="-70" width="80" height="140" rx="12" fill="none" stroke="#a855f7" stroke-width="2"/>
    <rect x="-32" y="-58" width="64" height="116" rx="8" fill="#1a1a3e" opacity="0.5"/>
    <circle cx="0" cy="55" r="4" fill="#a855f7"/>
    <!-- Screen content -->
    <rect x="-24" y="-48" width="48" height="96" rx="4" fill="none" stroke="#3b3b6e" stroke-width="0.5"/>
    <circle cx="0" cy="-30" r="10" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="-30" r="5" fill="#a855f7" opacity="0.3"/>
    <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
    <line x1="-15" y1="-2" x2="15" y2="-2" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
    <line x1="-15" y1="6" x2="15" y2="6" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#4ade80" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Sound waves -->
  <g filter="url(#glow)">
    <path d="M470,350 Q450,300 470,250" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
    <path d="M450,380 Q410,300 450,220" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <path d="M730,350 Q750,300 730,250" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
    <path d="M750,380 Q790,300 750,220" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Orbiting elements -->
  <g filter="url(#glow)">
    <circle cx="400" cy="200" r="8" fill="#06b6d4" opacity="0.6"/>
    <circle cx="800" cy="500" r="6" fill="#a855f7" opacity="0.5"/>
    <circle cx="350" cy="500" r="10" fill="#ec4899" opacity="0.4"/>
    <circle cx="850" cy="200" r="7" fill="#4ade80" opacity="0.5"/>
  </g>
  
  <!-- Text overlay -->
  <text x="600" y="550" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="36" font-weight="bold">AI Voice Agents</text>
  <text x="600" y="585" text-anchor="middle" fill="#a855f7" font-family="Inter, sans-serif" font-size="18">Never miss a call again</text>
</svg>